[server]
http_port = 3000
root_url = http://192.168.41.88:3000/

[security]
admin_user = admin
admin_password = $__file{/etc/grafana/spacefarm-admin-password}

[users]
allow_sign_up = false
default_theme = dark

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true

[dashboards]
min_refresh_interval = 15s
default_home_dashboard_path = /var/lib/grafana/dashboards/spacefarm.json

[log]
mode = console
level = warn

[smtp]
enabled = true
host = smtp.gmail.com:587
user = yusuke59160@gmail.com
password = $__file{/etc/grafana/spacefarm-smtp-password}
from_address = yusuke59160@gmail.com
from_name = SpaceFarm 2080
startTLS_policy = MandatoryStartTLS
skip_verify = false
