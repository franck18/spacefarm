apiVersion: 1
datasources:
  - name: SpaceFarm API
    uid: spacefarm-api
    type: yesoreyeram-infinity-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      auth_method: none
      allowedHosts:
        - http://127.0.0.1:8000
      allowDangerousHTTPMethods: false
      timeoutInSeconds: 10
      customHealthCheckEnabled: true
      customHealthCheckUrl: http://127.0.0.1:8000/api/health
